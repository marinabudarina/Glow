kind = "mobile"
previewPath = "/marina-mobile/"
title = "Marina — Mobile Intro"
version = "1.0.0"
id = "artifacts/marina-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/marina-mobile/" ]
localPort = 19136

[services.development]
run = "pnpm --filter @workspace/marina-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marina-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/marina-mobile", "run", "serve" ]

[services.env]
PORT = "19136"
BASE_PATH = "/marina-mobile/"
